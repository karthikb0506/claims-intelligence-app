services:
  db:
    image: postgres:16-alpine
    container_name: claims-db
    environment:
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: claims
      POSTGRES_DB: claims
    ports:
      - "5432:5432"
    volumes:
      - claims-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  claims-pgdata:
